name: Kyangc Release

on:
  push:
    tags:
      - 'kyangc-v*'

jobs:
  backend-contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            services/opencli-backend/package-lock.json

      - name: Install OpenCLI dependencies
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci --ignore-scripts --prefix services/opencli-backend

      - name: Verify backend and OpenCLI contract
        run: npm run verify:backend

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high --prefix services/opencli-backend

      - name: Render Compose configuration
        run: docker compose --env-file services/opencli-backend/.env.example -f services/opencli-backend/compose.yaml config --quiet

      - name: Build backend image from the tagged checkout
        run: docker build --target backend --tag local/opencli-backend:2.0.0.1 -f services/opencli-backend/Dockerfile .

      - name: Build Chromium image from the tagged checkout
        run: docker build --target chromium --tag local/opencli-chromium:2.0.0.1 -f services/opencli-backend/Dockerfile .

      - name: Run provider-neutral Compose smoke
        run: sh services/opencli-backend/scripts/smoke-compose.sh 2.0.0

  release:
    needs: backend-contract
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install CLI dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Verify fork release identifiers
        run: npm run check:fork-release

      - name: Run tests
        env:
          TZ: Asia/Shanghai
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build CLI
        run: npm run build

      - name: Pack CLI
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Type check extension
        run: npm run typecheck
        working-directory: extension

      - name: Build extension
        run: npm run build
        working-directory: extension

      - name: Package extension
        run: npm run package:release -- --out ../extension-package
        working-directory: extension

      - name: Create extension ZIP
        run: |
          EXTENSION_VERSION=$(jq -r .version extension/manifest.json)
          cd extension-package
          zip -r "../release-artifacts/opencli-extension-v${EXTENSION_VERSION}.zip" .

      - name: Write checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: release-artifacts/*
