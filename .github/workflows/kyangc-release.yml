name: Kyangc Release

on:
  push:
    tags:
      - 'kyangc-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install CLI dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Verify fork release identifiers
        run: npm run check:fork-release

      - name: Run tests
        env:
          TZ: Asia/Shanghai
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build CLI
        run: npm run build

      - name: Pack CLI
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Type check extension
        run: npm run typecheck
        working-directory: extension

      - name: Build extension
        run: npm run build
        working-directory: extension

      - name: Package extension
        run: npm run package:release -- --out ../extension-package
        working-directory: extension

      - name: Create extension ZIP
        run: |
          EXTENSION_VERSION=$(jq -r .version extension/manifest.json)
          cd extension-package
          zip -r "../release-artifacts/opencli-extension-v${EXTENSION_VERSION}.zip" .

      - name: Write checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: release-artifacts/*
